<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RioVibes - AI Music Generator</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f0f0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      color: #00f7ff;
      text-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
      margin-bottom: 30px;
    }

    textarea {
      width: 90%;
      max-width: 600px;
      height: 150px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
      font-size: 1rem;
      resize: none;
      box-shadow: 0 0 10px #00f7ff44;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 1rem;
      background: #00f7ff;
      border: none;
      border-radius: 8px;
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
    }

    button:hover {
      background: #00e0ff;
      transform: scale(1.05);
    }

    .output {
      margin-top: 40px;
      width: 90%;
      max-width: 600px;
      min-height: 100px;
      background: #1f1f1f;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px #00f7ff33;
    }
  </style>
</head>
<body>
  <h1>RioVibes</h1>
  <textarea placeholder="Paste your emotional lyrics here..."></textarea>
  <button>Generate Song</button>

  <div class="output">
    <!-- AI-generated song will appear here -->
    <p>🎶 Your song will be generated here soon...</p>
  </div>
</body>
</html>
