<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RioVibes - AI Music Generator</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f0f0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      color: #00f7ff;
      text-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
      margin-bottom: 20px;
    }

    select, textarea {
      width: 90%;
      max-width: 600px;
      margin: 10px 0;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 0 10px #00f7ff44;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 1rem;
      background: #00f7ff;
      border: none;
      border-radius: 8px;
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
    }

    button:hover {
      background: #00e0ff;
      transform: scale(1.05);
    }

    .output {
      margin-top: 30px;
      width: 90%;
      max-width: 600px;
      min-height: 100px;
      background: #1f1f1f;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px #00f7ff33;
    }
  </style>
</head>
<body>
  <h1>RioVibes</h1>

  <select id="mood">
    <option value="Romantic">Romantic</option>
    <option value="Sad">Sad</option>
    <option value="Chill">Chill</option>
    <option value="Pop">Pop</option>
    <option value="Lo-fi">Lo-fi</option>
  </select>

  <textarea placeholder="Write your lyrics here to turn them into a song..."></textarea>
  <button>Generate Song</button>

  <div class="output">
    <p>🎶 Your song will be generated here soon...</p>
  </div>

  <script>
    const button = document.querySelector("button");
    const textarea = document.querySelector("textarea");
    const mood = document.getElementById("mood");
    const output = document.querySelector(".output");

    button.addEventListener("click", () => {
      const lyrics = textarea.value.trim();
      const selectedMood = mood.value;

      if (lyrics === "") {
        output.innerHTML = "❌ Please enter some lyrics to generate a song.";
      } else {
        output.innerHTML = `
          <p>🎵 Generating your <strong>${selectedMood}</strong> song...</p>
          <p><em>"${lyrics.slice(0, 50)}..."</em></p>
          <p>✅ Your AI-based ${selectedMood} song is being prepared! (Demo mode)</p>
        `;
      }
    });
  </script>
</body>
</html>
